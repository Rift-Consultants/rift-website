<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">AI workflow implementation diagram</title>
  <desc id="desc">A warm abstract illustration of an AI workflow moving from discovery to deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F6F1"/>
      <stop offset="1" stop-color="#E4E5DF"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C65F50"/>
      <stop offset="1" stop-color="#AF7A62"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#2A2C2E" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="900" rx="46" fill="url(#bg)"/>
  <circle cx="1010" cy="130" r="170" fill="#C6CB97" opacity="0.28"/>
  <circle cx="140" cy="760" r="210" fill="#7CA3BE" opacity="0.18"/>
  <g filter="url(#shadow)">
    <rect x="155" y="170" width="890" height="560" rx="34" fill="#fff"/>
    <rect x="195" y="215" width="810" height="88" rx="22" fill="#2A2C2E"/>
    <circle cx="246" cy="259" r="15" fill="#C65F50"/>
    <circle cx="293" cy="259" r="15" fill="#C6CB97"/>
    <circle cx="340" cy="259" r="15" fill="#7CA3BE"/>
    <rect x="410" y="244" width="410" height="30" rx="15" fill="#EDEEE9" opacity="0.72"/>
    <g fill="none" stroke="#C65F50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M340 452h160"/>
      <path d="M700 452h160"/>
      <path d="M520 452c34-80 126-80 160 0"/>
      <path d="M520 452c34 80 126 80 160 0"/>
    </g>
    <g>
      <rect x="235" y="382" width="170" height="140" rx="28" fill="#F7F6F1" stroke="#E4E5DF" stroke-width="3"/>
      <text x="320" y="444" text-anchor="middle" font-family="Hanken Grotesk, Arial, sans-serif" font-size="22" font-weight="700" fill="#2A2C2E">Discover</text>
      <rect x="275" y="468" width="90" height="14" rx="7" fill="#C65F50" opacity="0.58"/>
