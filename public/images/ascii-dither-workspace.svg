<svg xmlns="http://www.w3.org/2000/svg" width="1028" height="1028" viewBox="0 0 1028 1028" role="img" aria-labelledby="title desc">
  <title id="title">Dithered ASCII technology workspace</title>
  <desc id="desc">A black and coral dithered ASCII-style workspace image with abstract buildings, screens, and data texture.</desc>
  <defs>
    <pattern id="dotAmber" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#C65F50"/>
    </pattern>
    <pattern id="dotCream" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#EDEEE9"/>
    </pattern>
    <pattern id="scanCream" width="6" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="1" width="6" height="1.5" fill="#EDEEE9"/>
      <rect x="0" y="5" width="4" height="1" fill="#C65F50" opacity=".75"/>
    </pattern>
    <filter id="roughen">
      <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
    <mask id="grainMask">
      <rect width="1028" height="1028" fill="black"/>
      <g filter="url(#roughen)">
        <ellipse cx="235" cy="205" rx="205" ry="150" fill="white" opacity=".88"/>
        <ellipse cx="590" cy="140" rx="260" ry="118" fill="white" opacity=".72"/>
        <ellipse cx="835" cy="185" rx="210" ry="180" fill="white" opacity=".78"/>
        <ellipse cx="730" cy="420" rx="185" ry="150" fill="white" opacity=".58"/>
        <ellipse cx="240" cy="650" rx="230" ry="185" fill="white" opacity=".62"/>
        <ellipse cx="860" cy="700" rx="205" ry="250" fill="white" opacity=".72"/>
        <ellipse cx="510" cy="930" rx="445" ry="118" fill="white" opacity=".92"/>
      </g>
    </mask>
    <mask id="buildingMask">
      <rect width="1028" height="1028" fill="black"/>
      <rect x="0" y="354" width="302" height="390" fill="white"/>
      <rect x="287" y="292" width="206" height="442" fill="white"/>
      <rect x="492" y="294" width="182" height="335" fill="white"/>
      <rect x="842" y="292" width="132" height="352" fill="white"/>
      <rect x="982" y="184" width="46" height="500" fill="white"/>
      <rect x="848" y="586" width="180" height="176" fill="white"/>
    </mask>
  </defs>
  <rect width="1028" height="1028" fill="#000"/>
  <rect width="1028" height="1028" fill="url(#dotAmber)" mask="url(#grainMask)" opacity=".95"/>
  <rect x="0" y="0" width="1028" height="1028" fill="url(#dotCream)" mask="url(#grainMask)" opacity=".42" transform="translate(2 2)"/>
  <rect width="1028" height="1028" fill="url(#dotAmber)" mask="url(#buildingMask)" opacity=".78"/>
  <rect x="0" y="800" width="760" height="105" fill="url(#scanCream)" opacity=".92"/>
  <rect x="734" y="980" width="294" height="28" fill="url(#scanCream)" opacity=".78"/>
  <rect x="288" y="292" width="205" height="442" fill="#000"/>
  <rect x="102" y="382" width="74" height="88" fill="#000" stroke="#C65F50" stroke-width="3"/>
  <rect x="492" y="292" width="182" height="338" fill="#000" stroke="#C65F50" stroke-width="2" stroke-dasharray="2 4"/>
  <rect x="844" y="292" width="130" height="352" fill="#000" stroke="#EDEEE9" stroke-width="1.5" stroke-dasharray="3 5" opacity=".8"/>
  <g opacity=".7">
    <path d="M42 257H182M52 262H172M62 267H158M72 272H148" stroke="#EDEEE9" stroke-width="2"/>
    <path d="M764 995H930M790 1002H908M812 1009H890" stroke="#EDEEE9" stroke-width="2"/>
    <path d="M383 789H608M344 801H643M302 813H676" stroke="#C65F50" stroke-width="2"/>
  </g>
  <g opacity=".8" fill="#C65F50">
    <circle cx="762" cy="338" r="2"/><circle cx="752" cy="344" r="1.5"/><circle cx="780" cy="357" r="1.5"/>
    <circle cx="70" cy="76" r="1.4"/><circle cx="96" cy="62" r="1.6"/><circle cx="118" cy="84" r="1.3"/>
    <circle cx="940" cy="84" r="1.5"/><circle cx="916" cy="112" r="1.2"/><circle cx="980" cy="142" r="1.6"/>
  </g>
</svg>
